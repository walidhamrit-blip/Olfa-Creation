backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "catalogue"
    label: "Catalogue de produits"
    files:
      - file: "content/produits.json"
        label: "Produits et Catégories"
        name: "produits_data"
        fields:
          - label: "Catégories / Collections"
            name: "categories"
            widget: "list"
            fields:
              - {label: "ID (ex: c1)", name: "id", widget: "string"}
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "string"}
              - {label: "Illustration", name: "art", widget: "string"}

          - label: "Liste des Produits"
            name: "products"
            widget: "list"
            fields:
              - {label: "ID (ex: p1)", name: "id", widget: "string"}
              - {label: "Nom du produit", name: "name", widget: "string"}
              - {label: "ID Catégorie (ex: c1)", name: "cat", widget: "string"}
              - {label: "Prix (€)", name: "price", widget: "number", value_type: "float"}
              - {label: "Illustration", name: "art", widget: "string"}
              - {label: "Badge", name: "badge", widget: "string", required: false}
              - {label: "Image URL", name: "imageUrl", widget: "image", required: false}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "En vedette", name: "featured", widget: "boolean", default: false}
